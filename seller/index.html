<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Bittu Store (Exports & Order Actions)</title>
    <link rel="stylesheet" href="../css/seller.css">
</head>
<body>
    <div class="container">
        <h1>Seller Dashboard</h1>
        <p>Manage your products and orders. Export products as CSV.</p>
        <div>
            <button onclick="exportSellerProducts()">Export Products CSV</button>
            <button onclick="loadSellerOrders()">Load My Orders</button>
        </div>
        <div id="sellerProducts"></div>
        <div id="sellerOrders"></div>
    </div>

    <script src="../assets/js/storage.js"></script>
    <script>
    function exportSellerProducts(){ const sellerId = 'SELLER-8821'; const products = Storage.load('products', []); const rows = products.filter(p=>p.sellerId===sellerId).map(p=>({ID:p.id,Name:p.name,Category:p.category,Price:p.price,OldPrice:p.oldPrice,QR:p.qrCode})); Storage.downloadCSV('seller_products.csv', rows); }
    function loadSellerOrders(){ const sellerId='SELLER-8821'; const orders = Storage.load('orders', []); const myOrders = orders.filter(o=>o.items.some(i=>i.seller && i.seller.indexOf('Bittu')!==-1)); const container = document.getElementById('sellerOrders'); container.innerHTML=''; if(!myOrders.length) { container.innerHTML='<p>No orders for your products.</p>'; return; } myOrders.forEach(o=>{ const el = document.createElement('div'); el.innerHTML = `<div><strong>${o.id}</strong> • ${o.customer} • ₹${o.amount} • ${o.status} <button onclick="changeStatus('${o.id}','Shipped')">Mark Shipped</button> <button onclick="changeStatus('${o.id}','Delivered')">Mark Delivered</button></div>`; container.appendChild(el); }); }
    function changeStatus(id,status){ const orders = Storage.load('orders', []); const idx = orders.findIndex(o=>o.id===id); if(idx===-1) return; orders[idx].status = status; Storage.save('orders', orders); alert('Updated'); loadSellerOrders(); }
    </script>
</body>
</html>
