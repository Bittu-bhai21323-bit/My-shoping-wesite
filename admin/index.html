<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bittu Store (Ledger & Exports)</title>
    <style>body{font-family:Arial,Helvetica,sans-serif;background:#f1f5f9;padding:20px} .container{max-width:1100px;margin:0 auto}</style>
</head>
<body>
    <div class="container">
        <h1>Admin Dashboard - Ledger</h1>
        <p>Manage commissions and export ledger.</p>
        <div style="margin:12px 0;">
            <button onclick="loadLedger()">Load Ledger</button>
            <button onclick="exportLedger()">Export Ledger CSV</button>
            <button onclick="clearLedger()">Clear Ledger</button>
        </div>
        <div id="ledgerTable"></div>
    </div>

    <script src="../assets/js/storage.js"></script>
    <script>
    // ledger stored in localStorage as 'ledger' or derived from orders
    function loadLedger(){ const orders = Storage.load('orders', []); // create ledger rows
        const rows = orders.map(o => ({ OrderID:o.id, SellerList: o.items.map(i=>i.seller).join('|'), Amount:o.amount, Status:o.status, Date: new Date(o.created).toLocaleString()})); const tbl = document.getElementById('ledgerTable'); if(rows.length===0){tbl.innerHTML='<p>No ledger entries.</p>'; return;} let html = '<table border="1" cellpadding="6" cellspacing="0"><thead><tr><th>Order</th><th>Sellers</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>'; rows.forEach(r=>{ html += `<tr><td>${r.OrderID}</td><td>${r.SellerList}</td><td>₹${r.Amount}</td><td>${r.Status}</td><td>${r.Date}</td></tr>`; }); html += '</tbody></table>'; tbl.innerHTML = html; }
    function exportLedger(){ const orders = Storage.load('orders', []); const rows = orders.map(o=>({OrderID:o.id,Sellers:o.items.map(i=>i.seller).join('|'),Amount:o.amount,Status:o.status,Date:new Date(o.created).toLocaleString()})); Storage.downloadCSV('ledger.csv', rows); }
    function clearLedger(){ if(!confirm('Clear all orders/ledger?')) return; Storage.save('orders', []); loadLedger(); alert('Ledger cleared'); }

    // initial
    loadLedger();
    </script>
</body>
</html>
